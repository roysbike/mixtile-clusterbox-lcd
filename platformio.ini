; E32R28T / ESP32-32E. Arduino-ESP32 2.0.17 matches the LCDWiki bring-up notes.
[env:e32r28t]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/load_env.py
; CH340 on the E32R28T drops the link at 921600 ("Packet content transfer stopped").
upload_speed = 115200
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.2.1
build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=13
    -DTFT_MISO=12
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
